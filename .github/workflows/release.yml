name: Release

# Publish a GitHub Release with the macOS app bundles whenever a version tag
# (e.g. v0.1.0) is pushed. To cut a release:
#
#   ./scripts/bump_version.sh 0.3.0
#   git commit -am "chore: release v0.3.0" && git push
#   git tag v0.3.0 && git push origin v0.3.0
#
# The app bundle is signed with the updater key (minisign), which is what the
# in-app updater verifies — store the private key as the repository secret
# TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/clipstack.key). It is NOT
# Apple Developer ID signing, so first launch still needs the
# Privacy & Security -> Open Anyway flow (see README troubleshooting).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0), no leading 'v'"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Create GitHub release and build app (first target only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign private key (contents of ~/.tauri/clipstack.key).
          # Required because tauri.conf.json sets a updater pubkey +
          # createUpdaterArtifacts; without it the build fails when signing
          # the updater tarball.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ClipStack v__VERSION__"
          releaseBody: "See the assets below to download ClipStack for macOS."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
