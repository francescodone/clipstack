[package]
name = "clipstack"
version = "0.3.0"
description = "ClipStack - a clipboard stack for macOS"
authors = ["donefran"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for `transparent` windows on macOS
# (it only became a no-op in 2.12; the resolved version gates `transparent` behind it).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
window-vibrancy = "0.8"
objc2-app-kit = { version = "0.3", features = [
  "NSPasteboard",
  "NSPasteboardItem",
  "NSWorkspace",
  "NSRunningApplication",
  "NSWindow",
  "NSColor",
  "NSApplication",
  "NSImage",
  "NSMenu",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = [
  "NSData",
  "NSDictionary",
  "NSNotification",
  "NSString",
  "NSURL",
  "NSArray",
  "NSObjCRuntime",
  "NSValue",
] }
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
